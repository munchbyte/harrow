server {
    listen 80;
    server_name harrow.goblinmedia.net;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name harrow.goblinmedia.net;

    # SSL managed by Certbot
    ssl_certificate /etc/letsencrypt/live/harrow.goblinmedia.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harrow.goblinmedia.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Tailscale access restriction
    # Uncomment and set your Tailscale subnet to restrict access:
    # allow 100.64.0.0/10;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support — disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Timeout for long-running SSE connections
        proxy_read_timeout 300s;
    }
}
